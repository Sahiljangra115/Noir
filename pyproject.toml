[project]
name = "final-year-project"
version = "0.4.0"
description = "AI Assistant Bot – full STT→LLM→TTS+Actions pipeline with VLA vision and ESP32 motor control"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # ── Core CV + detection ─────────────────────────────────────────────────
    "opencv-python>=4.9",        # cv2 with GUI (imshow) support
    "ultralytics>=8.2",          # YOLOv8n human/object detection
    "numpy>=1.26",
    # ── Ollama REST API (VLA + LLM parser) ──────────────────────────────────
    "requests>=2.31",
    # ── Voice pipeline ───────────────────────────────────────────────────────
    "faster-whisper>=1.0",       # STT  – CUDA accelerated Whisper
    "openwakeword>=0.4",         # Wake word – openWakeWord (hey_jarvis stock model, no key)
    "onnxruntime>=1.20",         # openWakeWord inference backend (ONNX models, no tflite)
    "piper-tts>=1.4",            # TTS  – offline neural voices (amy-medium)
    "sounddevice>=0.4",          # Mic input + audio playback via PortAudio
    # Requires: sudo apt install portaudio19-dev
    # ── Mobile app / WebSocket ───────────────────────────────────────────────
    "flask-socketio>=5.3",       # WebSocket support for Flutter phone app
    "simple-websocket>=1.0",     # Fast threading-mode transport
    # ── Config / secrets ─────────────────────────────────────────────────────
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# Entry point was "main:main", but main.py lives in the backend package — the
# `robot` command failed with ModuleNotFoundError.
[project.scripts]
robot = "backend.main:main"

[tool.uv]
# openwakeword hard-requires tflite-runtime on linux, which has no cp312 wheel.
# We run its ONNX path via onnxruntime instead, so drop tflite from resolution.
override-dependencies = ["tflite-runtime ; sys_platform == 'never'"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=.",
    "--cov-report=html:htmlcov",
    "--cov-report=term-missing",
    "--cov-report=json:coverage.json",
    # Floor, not a target. Measured 55% at the time of writing; the gate sits
    # just below so a real regression trips it without failing on noise.
    "--cov-fail-under=50",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for component interactions",
    "e2e: End-to-end tests for full workflows",
    "slow: Tests that take a long time to run",
    "hardware: Tests that require physical hardware",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
